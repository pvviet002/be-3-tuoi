<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tập Viết Chữ — Bé tô theo nét chữ cái</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0EA5A4">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#0E9F9E;--p-deep:#0B6F6E;--edge:#B5E4E2;--leaf:#2E9A64;--sun:#FFCB3D;--ink:#4A4458;--soft:#8B85A0;--berry:#E84D89}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);min-height:100vh;padding:12px;display:flex;justify-content:center;
  background:linear-gradient(180deg,#C9F3F1 0%,#EAFBFA 55%,#FFF6EC 100%);user-select:none;-webkit-user-select:none;overflow-x:hidden}
.stage{width:100%;max-width:720px;border:8px solid #fff;border-radius:32px;padding:14px 16px 22px;
  background:linear-gradient(180deg,#9FE8E5 0%,#E3F8F7 50%,#F1FBEF 100%);box-shadow:0 24px 50px rgba(20,140,140,.28);
  display:flex;flex-direction:column;align-items:center;gap:12px}
.bar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px}
.btn{border:0;cursor:pointer;font:inherit;font-weight:800;border-radius:99px;padding:8px 18px;background:#fff;color:var(--p-deep);
  box-shadow:0 4px 0 rgba(0,0,0,.14);font-size:1rem;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.14)}
.btn.main{background:var(--p);color:#fff;box-shadow:0 4px 0 var(--p-deep)}
.score{font-weight:800;background:var(--sun);color:#7A5C00;border-radius:99px;padding:6px 16px;box-shadow:0 4px 0 #F5A700}
h1{font-size:clamp(1.3rem,5vw,2rem);color:var(--p-deep);text-shadow:0 2px 0 #fff;text-align:center}
.hidden{display:none!important}
.sub{font-weight:700;color:var(--soft);text-align:center}
.menu{display:flex;flex-direction:column;gap:12px;width:100%;align-items:center}

/* Chọn chữ */
.tabs{display:flex;gap:8px}
.tab{border:0;cursor:pointer;font:inherit;font-weight:800;border-radius:99px;padding:8px 20px;background:#fff;color:var(--p-deep);box-shadow:0 4px 0 var(--edge);font-size:1.05rem}
.tab.on{background:var(--p);color:#fff;box-shadow:0 4px 0 var(--p-deep)}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;width:100%}
.let{position:relative;aspect-ratio:1;border:0;cursor:pointer;font:inherit;font-weight:800;font-size:min(8.5vw,2.3rem);border-radius:18px;color:#fff;
  box-shadow:0 5px 0 rgba(0,0,0,.2);border:3px solid #fff;display:flex;align-items:center;justify-content:center;padding:0}
.let:active{transform:translateY(3px)}
.let:nth-child(6n+1){background:#F472B6}.let:nth-child(6n+2){background:#FB923C}.let:nth-child(6n+3){background:#34D399}
.let:nth-child(6n+4){background:#60A5FA}.let:nth-child(6n+5){background:#A78BFA}.let:nth-child(6n+6){background:#F59E0B}
.let .tick{position:absolute;right:0;top:-3px;font-size:.9rem}

/* Khung viết */
.ask{display:flex;align-items:center;gap:12px;background:#fff;border-radius:26px;padding:10px 20px;box-shadow:0 6px 0 var(--edge);cursor:pointer;border:0;font:inherit;text-align:left}
.ask .say{font-size:2rem}
.ask .txt{font-weight:800;font-size:clamp(1.1rem,4.4vw,1.5rem);color:var(--berry);line-height:1.1}
.ask:active{transform:translateY(3px)}
.pad{width:min(100%,360px);aspect-ratio:100/140;background:#fff;border-radius:30px;border:6px solid #fff;box-shadow:0 8px 0 var(--edge),0 16px 26px rgba(20,140,140,.18);position:relative;overflow:hidden}
.pad svg{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.pad.done{animation:bounce .6s}
.guide{fill:none;stroke:#D5ECEB;stroke-linecap:round;stroke-linejoin:round}
.dash{fill:none;stroke:#8BC4C2;stroke-linecap:round}
.prog{fill:none;stroke-linecap:round;stroke-linejoin:round}
.start circle.ring{fill:#34D399;stroke:#fff;stroke-width:2.5}
.start circle.pulse{fill:#34D399;opacity:.35;animation:pulse 1.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
.start text{fill:#fff;font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:9px;text-anchor:middle;dominant-baseline:central}
.head{fill:#FFCB3D;stroke:#fff;stroke-width:2}
@keyframes pulse{from{transform:scale(.8);opacity:.5}to{transform:scale(2);opacity:0}}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.praise{font-weight:800;font-size:1.25rem;color:var(--leaf);min-height:1.7em;text-align:center}
.star{position:fixed;pointer-events:none;font-size:2rem;animation:fly 1.1s ease-out forwards;z-index:50}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(360deg);opacity:0}}
@keyframes bounce{40%{transform:scale(1.05) rotate(-1.5deg)}70%{transform:scale(.99) rotate(1deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<script src="tracker.js"></script>
</head>
<body>
<main class="stage">
  <div class="bar">
    <a class="btn" href="index.html" id="home" aria-label="Về trang chủ">🏠 Về nhà</a>
    <button class="btn hidden" id="back" aria-label="Chọn chữ khác">⬅ Chọn chữ</button>
    <span class="score hidden" id="score" aria-live="polite">⭐ 0</span>
  </div>
  <h1>Tập Viết Chữ</h1>

  <section class="menu" id="pick">
    <div class="tabs" role="tablist">
      <button class="tab on" id="tab-upper" role="tab">Chữ HOA</button>
      <button class="tab" id="tab-lower" role="tab">Chữ thường</button>
    </div>
    <p class="sub">Bé chọn một chữ để tập viết nhé!</p>
    <div class="grid" id="grid"></div>
  </section>

  <section class="menu hidden" id="play">
    <button class="ask" id="ask" aria-label="Nghe lại"><span class="say">🔊</span><span class="txt" id="qtext"></span></button>
    <div class="pad" id="pad"><svg id="svg" viewBox="0 0 100 140" aria-label="Khung tập viết chữ"></svg></div>
    <div class="praise" id="praise" aria-live="polite"></div>
    <div class="row">
      <button class="btn" id="demo">👀 Xem cách viết</button>
      <button class="btn" id="retry">🔄 Viết lại</button>
      <button class="btn main hidden" id="next">Chữ tiếp theo ▶</button>
    </div>
  </section>

  <button class="btn" id="mute" aria-pressed="false">🔊 Âm thanh: Bật</button>
</main>

<script>
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const PRAISES = ['Giỏi quá!','Đúng rồi!','Bé tuyệt vời!','Hoan hô!'];
const COLORS = ['#EC4899','#F97316','#10B981','#3B82F6','#8B5CF6'];
/* Danh sách chữ cái tiếng Việt: [chữ hoa, chữ thường, tên đọc] — cùng cách đọc với trò Học Chữ Cái */
const LETTERS = [['A','a','a'],['Ă','ă','á'],['Â','â','ớ'],['B','b','bờ'],['C','c','cờ'],['D','d','dờ'],['Đ','đ','đờ'],['E','e','e'],['Ê','ê','ê'],
  ['G','g','gờ'],['H','h','hờ'],['I','i','i'],['K','k','ca'],['L','l','lờ'],['M','m','mờ'],['N','n','nờ'],['O','o','o'],['Ô','ô','ô'],['Ơ','ơ','ơ'],
  ['P','p','pờ'],['Q','q','quy'],['R','r','rờ'],['S','s','sờ'],['T','t','tờ'],['U','u','u'],['Ư','ư','ư'],['V','v','vờ'],['X','x','xờ'],['Y','y','i dài']];

/* ── Nét viết (khung tự do; trò sẽ tự thu phóng cho vừa khung). Mỗi nét là một đường liền, thứ tự như khi viết. ── */
const hat   = (cx, y) => `M${cx-14} ${y+12} L${cx} ${y} L${cx+14} ${y+12}`;             // dấu mũ ^
const breve = (cx, y) => `M${cx-16} ${y} C${cx-10} ${y+12} ${cx+10} ${y+12} ${cx+16} ${y}`; // dấu á ∪
const UP = {};
UP.A = ['M18 128 L50 28 L82 128', 'M30 92 L70 92'];
UP.B = ['M22 28 L22 128', 'M22 28 L50 28 C78 28 78 78 50 78 L22 78', 'M22 78 L54 78 C86 78 86 128 54 128 L22 128'];
UP.C = ['M80 48 C70 30 58 28 50 28 C28 28 18 52 18 78 C18 104 28 128 50 128 C62 128 74 122 82 106'];
UP.D = ['M22 28 L22 128', 'M22 28 L42 28 C86 30 86 126 42 128 L22 128'];
UP.E = ['M78 28 L22 28 L22 128 L78 128', 'M22 78 L68 78'];
UP.G = ['M80 48 C70 30 58 28 50 28 C28 28 18 52 18 78 C18 104 28 128 50 128 C70 128 80 118 80 100 L80 82 L52 82'];
UP.H = ['M22 28 L22 128', 'M78 28 L78 128', 'M22 78 L78 78'];
UP.I = ['M50 28 L50 128'];
UP.K = ['M24 28 L24 128', 'M78 28 L26 80 L80 128'];
UP.L = ['M24 28 L24 128 L80 128'];
UP.M = ['M18 128 L18 28 L50 90 L82 28 L82 128'];
UP.N = ['M20 128 L20 28 L80 128 L80 28'];
const O_UP = 'M50 28 C24 28 18 52 18 78 C18 104 24 128 50 128 C76 128 82 104 82 78 C82 52 76 28 50 28';
UP.O = [O_UP];
UP.P = ['M22 28 L22 128', 'M22 28 L50 28 C80 28 80 80 50 80 L22 80'];
UP.Q = [O_UP, 'M56 98 L86 132'];
UP.R = ['M22 28 L22 128', 'M22 28 L50 28 C80 28 80 80 50 80 L22 80', 'M48 80 L80 128'];
UP.S = ['M78 44 C74 30 62 28 50 28 C32 28 24 40 28 54 C32 68 70 82 74 100 C78 120 60 128 48 128 C34 128 24 120 20 106'];
UP.T = ['M16 28 L84 28', 'M50 28 L50 128'];
UP.U = ['M20 28 L20 100 C20 120 32 128 50 128 C68 128 80 120 80 100 L80 28'];
UP.V = ['M16 28 L50 128 L84 28'];
UP.X = ['M18 28 L82 128', 'M82 28 L18 128'];
UP.Y = ['M16 28 L50 78 L84 28', 'M50 78 L50 128'];
UP['Ă'] = [...UP.A, breve(50, 8)];
UP['Â'] = [...UP.A, hat(50, 6)];
UP['Đ'] = [...UP.D, 'M6 78 L46 78'];
UP['Ê'] = [...UP.E, hat(50, 6)];
UP['Ô'] = [...UP.O, hat(50, 6)];
UP['Ơ'] = [...UP.O, 'M76 40 C90 38 94 28 90 18'];
UP['Ư'] = [...UP.U, 'M80 52 C92 50 96 40 92 30'];

const LO = {};
const BOWL = 'M68 74 C62 62 52 58 44 58 C28 58 20 70 20 83 C20 98 30 108 44 108 C56 108 66 100 70 90';  // vòng tròn của a, d, g, q
const O_LO = 'M50 58 C30 58 20 70 20 83 C20 98 30 108 50 108 C70 108 80 98 80 83 C80 70 70 58 50 58';
const E_LO = 'M20 84 L78 84 C78 68 68 58 50 58 C32 58 20 70 20 84 C20 98 32 108 50 108 C62 108 72 104 78 96';
LO.a = [BOWL, 'M72 58 L72 108'];
LO.b = ['M26 22 L26 108', 'M26 80 C30 64 40 58 50 58 C66 58 78 70 78 84 C78 98 66 108 50 108 C38 108 28 100 26 90'];
LO.c = ['M72 70 C64 60 54 58 46 58 C30 58 20 70 20 83 C20 98 30 108 46 108 C56 108 66 104 74 94'];
LO.d = [BOWL, 'M72 22 L72 108'];
LO.e = [E_LO];
LO.g = [BOWL, 'M72 58 L72 120 C72 134 60 138 46 138 C36 138 28 134 24 128'];
LO.h = ['M26 22 L26 108', 'M26 80 C30 64 40 58 52 58 C68 58 76 66 76 80 L76 108'];
LO.i = ['M50 58 L50 108', 'M50 32 C46 32 46 42 50 42 C54 42 54 32 50 32'];
LO.k = ['M26 22 L26 108', 'M72 58 L28 86 L76 108'];
LO.l = ['M50 22 L50 108'];
LO.m = ['M16 58 L16 108', 'M16 80 C18 64 26 58 36 58 C46 58 50 66 50 78 L50 108', 'M50 78 C52 64 60 58 70 58 C80 58 84 66 84 78 L84 108'];
LO.n = ['M26 58 L26 108', 'M26 80 C30 64 40 58 52 58 C68 58 76 66 76 80 L76 108'];
LO.o = [O_LO];
LO.p = ['M26 58 L26 138', 'M26 80 C30 64 40 58 52 58 C68 58 78 70 78 84 C78 98 68 108 52 108 C40 108 30 100 26 90'];
LO.q = [BOWL, 'M72 58 L72 138'];
LO.r = ['M30 58 L30 108', 'M30 82 C32 66 42 58 56 58 C62 58 66 60 68 62'];
LO.s = ['M70 68 C64 60 56 58 48 58 C34 58 26 64 28 74 C30 84 66 84 72 96 C76 106 62 108 50 108 C38 108 28 104 24 96'];
LO.t = ['M44 30 L44 96 C44 106 50 108 58 108 C62 108 66 107 70 104', 'M28 58 L66 58'];
LO.u = ['M24 58 L24 90 C24 102 34 108 48 108 C62 108 72 100 76 88', 'M76 58 L76 108'];
LO.v = ['M20 58 L48 108 L76 58'];
LO.x = ['M22 58 L76 108', 'M76 58 L22 108'];
LO.y = ['M22 58 L48 106', 'M76 58 L44 120 C38 132 30 138 22 138'];
LO['ă'] = [...LO.a, breve(46, 34)];
LO['â'] = [...LO.a, hat(46, 32)];
LO['đ'] = [...LO.d, 'M56 38 L90 38'];
LO['ê'] = [...LO.e, hat(49, 32)];
LO['ô'] = [...LO.o, hat(50, 32)];
LO['ơ'] = [...LO.o, 'M72 62 C84 60 88 52 86 42'];
LO['ư'] = [...LO.u, 'M76 70 C88 68 92 60 90 50'];

let muted = false, mode = 'upper', cur = null, strokes = [], si = 0, finished = false, demoing = false, down = false, score = 0, lastP = null;
try { muted = localStorage.getItem('letterMuted') === '1'; } catch(e){}

/* ── Giọng đọc + tiếng bíp ── */
let viVoice = null;
function loadVoice(){ viVoice = (speechSynthesis.getVoices()||[]).find(v=>/^vi/i.test(v.lang)) || null; }
if ('speechSynthesis' in window){ loadVoice(); speechSynthesis.onvoiceschanged = loadVoice; }
function say(text){
  if (muted || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'vi-VN'; if (viVoice) u.voice = viVoice; u.rate = .8; u.pitch = 1.2;
  speechSynthesis.speak(u);
}
let ac = null;
function beep(freq){
  if (muted) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq*1.7, t+.12);
    g.gain.setValueAtTime(.22, t); g.gain.exponentialRampToValueAtTime(.01, t+.2);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+.22);
  }catch(e){}
}

/* ── Tiến độ: { chữ: số lần đã viết xong } (chữ hoa và chữ thường tính riêng) ── */
function loadDone(){ try { return JSON.parse(localStorage.getItem('letterDone')) || {}; } catch(e){ return {}; } }
function saveDone(o){ try { localStorage.setItem('letterDone', JSON.stringify(o)); } catch(e){} }
const totalWrites = () => Object.values(loadDone()).reduce((a, b) => a + b, 0);
/* Bé mới viết: nét to và cho lệch nhiều; sau 15 lần viết xong thì nét mảnh hơn */
const easy = () => totalWrites() < 15;
const WIDTH = () => easy() ? 15 : 11;
const TOL = () => easy() ? 16 : 12;
const STEP = 1.5, LOOK = 14;
const glyph = (key, m) => (m === 'upper' ? UP : LO)[key];
const caseIdx = () => mode === 'upper' ? 0 : 1;
const nameOf = ch => LETTERS.find(l => l[0] === ch || l[1] === ch);

/* ── Màn chọn chữ ── */
function renderPick(){
  const done = loadDone();
  $('tab-upper').classList.toggle('on', mode === 'upper'); $('tab-lower').classList.toggle('on', mode === 'lower');
  $('grid').innerHTML = LETTERS.map(l => { const ch = l[caseIdx()];
    return `<button class="let" data-c="${ch}" aria-label="Chữ ${l[2]}">${ch}${done[ch] ? '<span class="tick">⭐</span>' : ''}</button>`; }).join('');
  $('grid').querySelectorAll('.let').forEach(b => b.onclick = () => openLetter(b.dataset.c));
}
$('tab-upper').onclick = () => { mode = 'upper'; renderPick(); };
$('tab-lower').onclick = () => { mode = 'lower'; renderPick(); };
function show(name){
  $('pick').classList.toggle('hidden', name !== 'pick');
  $('play').classList.toggle('hidden', name !== 'play');
  $('back').classList.toggle('hidden', name === 'pick');
  $('home').classList.toggle('hidden', name !== 'pick');
  $('score').classList.toggle('hidden', name !== 'play');
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  if (name === 'pick') renderPick();
}
$('back').onclick = () => show('pick');

/* ── Dựng khung viết: đo nét, thu phóng cho vừa khung, rồi vẽ ── */
function el(tag, attrs, parent){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); (parent || $('svg')).appendChild(e); return e; }
const QUESTION = ch => 'Bé viết chữ ' + nameOf(ch)[2] + (mode === 'upper' ? ' in hoa' : ' in thường') + ' nhé!';
function openLetter(ch){
  cur = ch; finished = false; si = 0; down = false; demoing = false; lastP = null;
  $('praise').textContent = ''; $('next').classList.add('hidden'); $('pad').classList.remove('done');
  const svg = $('svg'); svg.innerHTML = '';
  const defs = glyph(ch, mode), color = COLORS[LETTERS.findIndex(l => l[caseIdx()] === ch) % COLORS.length];

  // 1) đo: dựng tạm các nét để lấy điểm mẫu và khung bao
  const tmp = el('g', {}), raw = defs.map(d => { const p = el('path', { d, fill: 'none' }, tmp); const len = p.getTotalLength(), pts = [];
    for (let k = 0, n = Math.ceil(len / STEP) + 1; k < n; k++){ const l = Math.min(k * STEP, len), q = p.getPointAtLength(l); pts.push({ x: q.x, y: q.y, l }); }
    return { d, len, pts }; });
  svg.removeChild(tmp);
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  raw.forEach(r => r.pts.forEach(q => { x0 = Math.min(x0, q.x); y0 = Math.min(y0, q.y); x1 = Math.max(x1, q.x); y1 = Math.max(y1, q.y); }));
  const bw = Math.max(1, x1 - x0), bh = Math.max(1, y1 - y0);
  const sc = Math.min(70 / bw, 108 / bh, 1.7);                       // vừa khung, không phóng quá to
  const tx = 50 - sc * (x0 + x1) / 2, ty = 70 - sc * (y0 + y1) / 2;  // căn giữa khung
  const W = WIDTH();

  // 2) vẽ: nhóm có phép biến đổi (nét dày/chấm được chia lại theo tỉ lệ để giữ độ dày thật)
  const g = el('g', { transform: `translate(${tx} ${ty}) scale(${sc})` });
  strokes = raw.map(r => {
    const guide = el('path', { d: r.d, class: 'guide', 'stroke-width': W / sc }, g);
    el('path', { d: r.d, class: 'dash', 'stroke-width': 1.4 / sc, 'stroke-dasharray': (1.5 / sc) + ' ' + (5 / sc) }, g);
    const prog = el('path', { d: r.d, class: 'prog', stroke: color, 'stroke-width': (W - 2) / sc, 'stroke-dasharray': r.len + ' ' + (r.len + 5), 'stroke-dashoffset': r.len }, g);
    const samples = r.pts.map(q => ({ x: sc * q.x + tx, y: sc * q.y + ty, l: q.l }));   // toạ độ thật trong khung 100x140
    return { guide, prog, len: r.len, samples, idx: 0 };
  });
  strokes.forEach((s, i) => {
    const gr = el('g', { class: 'start', id: 'start' + i }), p0 = s.samples[0];
    el('circle', { class: 'pulse', cx: p0.x, cy: p0.y, r: 6 }, gr);
    el('circle', { class: 'ring', cx: p0.x, cy: p0.y, r: 6 }, gr);
    if (strokes.length > 1) { const t = el('text', { x: p0.x, y: p0.y + .5 }, gr); t.textContent = i + 1; }
    if (i > 0) gr.style.display = 'none';
  });
  el('circle', { class: 'head', id: 'head', r: 4.5, cx: -10, cy: -10 });
  $('qtext').textContent = QUESTION(ch);
  show('play');
  setTimeout(() => say(QUESTION(ch) + ' Đặt ngón tay vào chấm xanh rồi kéo theo đường chấm.'), 300);
}

/* ── Theo dõi ngón tay (giống Tập Viết Số) ── */
function toSvg(e){
  const svg = $('svg'), pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
function setProgress(s){
  const q = s.samples[s.idx];
  s.prog.setAttribute('stroke-dashoffset', s.len - q.l);
  const h = $('head'); h.setAttribute('cx', q.x); h.setAttribute('cy', q.y);
}
/* Xử lý một điểm của ngón tay; trả về false khi cần dừng (xong nét hoặc xong chữ) */
function advanceAt(P){
  const s = strokes[si], R = TOL();
  let best = -1;
  const end = Math.min(s.samples.length - 1, s.idx + LOOK);
  for (let k = s.idx; k <= end; k++){
    const q = s.samples[k];
    if (Math.hypot(q.x - P.x, q.y - P.y) <= R) best = k;   // lấy điểm xa nhất còn nằm trong phạm vi cho phép
  }
  if (best > s.idx){ s.idx = best; setProgress(s); }
  if (s.idx >= s.samples.length - 3){
    s.idx = s.samples.length - 1; setProgress(s); beep(520);
    $('start' + si).style.display = 'none';
    si++;
    if (si >= strokes.length){ success(); return false; }
    $('start' + si).style.display = '';
    $('head').setAttribute('cx', -10);
    down = false;                                   // nét sau phải nhấc tay lên rồi đặt lại ở chấm xanh mới
    return false;
  }
  return true;
}
/* Khi bé vuốt nhanh, trình duyệt chỉ gửi vài vị trí thưa; nội suy các điểm giữa (mỗi khoảng <= 5 đơn vị) để không bị kẹt tiến độ */
function onMove(e){
  if (!down || finished || demoing) return;
  const P = toSvg(e), pts = [];
  if (lastP){
    const dx = P.x - lastP.x, dy = P.y - lastP.y, n = Math.max(1, Math.ceil(Math.hypot(dx, dy) / 5));
    for (let k = 1; k <= n; k++) pts.push({ x: lastP.x + dx * k / n, y: lastP.y + dy * k / n });
  } else pts.push(P);
  lastP = P;
  for (const q of pts) if (!advanceAt(q)) break;
}
const svgEl = $('svg');
svgEl.addEventListener('pointerdown', e => { if (finished || demoing) return; e.preventDefault(); down = true; lastP = null; try { svgEl.setPointerCapture(e.pointerId); } catch(_){} onMove(e); });
svgEl.addEventListener('pointermove', onMove);
['pointerup','pointercancel'].forEach(t => svgEl.addEventListener(t, () => { down = false; lastP = null; }));

function success(){
  finished = true; down = false; $('head').setAttribute('cx', -10);
  $('pad').classList.add('done'); beep(660);
  if (window.BeTracker) BeTracker.round(true);
  const done = loadDone(); done[cur] = (done[cur] || 0) + 1; saveDone(done);
  score++; $('score').textContent = '⭐ ' + score;
  const p = PRAISES[Math.floor(Math.random() * PRAISES.length)];
  $('praise').textContent = p + ' 🎉';
  $('next').classList.remove('hidden');
  const r = $('pad').getBoundingClientRect();
  for (let i = 0; i < 12; i++){
    const s = document.createElement('div'); s.className = 'star'; s.textContent = '⭐';
    s.style.left = (r.left + r.width/2) + 'px'; s.style.top = (r.top + r.height/2) + 'px';
    s.style.setProperty('--dx', (Math.random()*300 - 150) + 'px'); s.style.setProperty('--dy', (Math.random()*-260 - 20) + 'px');
    document.body.appendChild(s); setTimeout(() => s.remove(), 1200);
  }
  say(p + ' Bé đã viết được chữ ' + nameOf(cur)[2] + '.');
}

/* ── Nút: xem mẫu, viết lại, chữ tiếp theo ── */
function resetStrokes(){ if ('speechSynthesis' in window) speechSynthesis.cancel(); strokes.forEach(s => { s.idx = 0; s.prog.setAttribute('stroke-dashoffset', s.len); }); si = 0; $('head').setAttribute('cx', -10); }
function hideStarts(){ strokes.forEach((_, i) => $('start' + i).style.display = 'none'); }
function showStarts(){ strokes.forEach((_, i) => $('start' + i).style.display = i === 0 ? '' : 'none'); }
$('demo').onclick = () => {
  if (demoing || finished) return;
  resetStrokes(); demoing = true; hideStarts();
  let k = 0;
  const runStroke = () => {
    if (k >= strokes.length){ demoing = false; resetStrokes(); showStarts(); return; }
    const s = strokes[k], t0 = performance.now(), dur = 1400;
    const step = now => {
      const f = Math.min(1, (now - t0) / dur), l = f * s.len;
      s.prog.setAttribute('stroke-dashoffset', s.len - l);
      const q = s.samples[Math.min(s.samples.length - 1, Math.round(l / STEP))];
      $('head').setAttribute('cx', q.x); $('head').setAttribute('cy', q.y);
      if (f < 1) requestAnimationFrame(step); else { k++; setTimeout(runStroke, 350); }
    };
    requestAnimationFrame(step);
  };
  runStroke();
};
$('retry').onclick = () => openLetter(cur);
$('next').onclick = () => { const i = LETTERS.findIndex(l => l[caseIdx()] === cur); openLetter(LETTERS[(i + 1) % LETTERS.length][caseIdx()]); };
$('ask').onclick = () => say(QUESTION(cur) + ' Đặt ngón tay vào chấm xanh rồi kéo theo đường chấm.');

function renderMute(){ $('mute').textContent = muted ? '🔇 Âm thanh: Tắt' : '🔊 Âm thanh: Bật'; $('mute').setAttribute('aria-pressed', muted); }
$('mute').onclick = () => { muted = !muted; try { localStorage.setItem('letterMuted', muted ? '1' : '0'); } catch(e){}; if (muted && 'speechSynthesis' in window) speechSynthesis.cancel(); renderMute(); };
renderMute(); show('pick');
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
