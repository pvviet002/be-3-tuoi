<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tiếng Con Vật — Con nào kêu thế nhỉ?</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFB169">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--tang:#FF9A3D;--tang-deep:#EE7F14;--leaf:#43B97F;--leaf-deep:#2E9A64;--berry:#E84D89;--sun:#FFCB3D;--ink:#4A4458;--ink-soft:#8B85A0}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);min-height:100vh;padding:12px;display:flex;justify-content:center;
  background:linear-gradient(180deg,#FFE3C2 0%,#FFF3E2 55%,#F2FBEF 100%);user-select:none;-webkit-user-select:none;overflow-x:hidden}
.stage{width:100%;max-width:720px;border:8px solid #fff;border-radius:32px;padding:14px 16px 22px;
  background:linear-gradient(180deg,#FFD9A8 0%,#FFF1DC 45%,#EFFAEF 100%);box-shadow:0 24px 50px rgba(200,120,40,.3);
  display:flex;flex-direction:column;align-items:center;gap:14px}
.bar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px}
.btn{border:0;cursor:pointer;font:inherit;font-weight:800;border-radius:99px;padding:8px 18px;background:#fff;color:var(--tang-deep);
  box-shadow:0 4px 0 rgba(0,0,0,.14);font-size:1rem;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.14)}
.score{font-weight:800;background:var(--sun);color:#7A5C00;border-radius:99px;padding:6px 16px;box-shadow:0 4px 0 #F5A700}
h1{font-size:clamp(1.3rem,5vw,2rem);color:var(--tang-deep);text-shadow:0 2px 0 #fff;text-align:center}
.ask{display:flex;align-items:center;gap:12px;background:#fff;border-radius:28px;padding:12px 20px;box-shadow:0 6px 0 #F2D2AA;cursor:pointer;border:0;font:inherit}
.ask .say{font-size:2.2rem}
.ask .txt{font-weight:800;font-size:clamp(1.2rem,4.6vw,1.8rem);color:var(--berry)}
.ask .sound{font-size:clamp(1.8rem,7vw,2.8rem);font-weight:800;color:var(--tang-deep);display:block;line-height:1.05}
.ask:active{transform:translateY(3px)}
.praise{font-weight:800;font-size:1.3rem;color:var(--leaf-deep);min-height:1.8em;text-align:center}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%}
.choices.two{grid-template-columns:repeat(2,1fr)}
.choice{aspect-ratio:1;border:0;cursor:pointer;background:#fff;border-radius:28px;border:5px solid #fff;font-size:min(22vw,110px);
  display:flex;align-items:center;justify-content:center;box-shadow:0 7px 0 #F2D2AA,0 14px 22px rgba(200,120,40,.2);
  transition:transform .12s;animation:pop .4s cubic-bezier(.34,1.5,.5,1) both}
.choice:nth-child(2){animation-delay:.07s}.choice:nth-child(3){animation-delay:.14s}
.choice:active{transform:translateY(4px)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.choice.wrong{animation:shake .4s;opacity:.4}
.choice.right{outline:6px solid var(--sun);animation:bounce .6s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes bounce{40%{transform:scale(1.14) rotate(-4deg)}70%{transform:scale(.97) rotate(3deg)}}
.star{position:fixed;pointer-events:none;font-size:2rem;animation:fly 1.1s ease-out forwards;z-index:50}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(360deg);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<script src="tracker.js"></script>
</head>
<body>
<main class="stage">
  <div class="bar">
    <a class="btn" href="index.html" aria-label="Về trang chủ">🏠 Về nhà</a>
    <span class="score" id="score" aria-live="polite">⭐ 0</span>
  </div>
  <h1>Tiếng Con Vật</h1>
  <button class="ask" id="ask" aria-label="Nghe lại câu hỏi">
    <span class="say">🔊</span>
    <span class="txt">Con nào kêu<span class="sound" id="sound"></span></span>
  </button>
  <div class="praise" id="praise" aria-live="polite"></div>
  <div class="choices" id="choices"></div>
  <button class="btn" id="mute" aria-pressed="false">🔊 Âm thanh: Bật</button>
</main>

<script>
/* [hình, tên, tiếng kêu] */
const ANIMALS = [
  ['🐶','con chó','gâu gâu'],['🐱','con mèo','meo meo'],['🐮','con bò','ùm bò'],['🐷','con heo','ụt ịt'],
  ['🐔','con gà','cục tác'],['🐥','gà con','chíp chíp'],['🦆','con vịt','quạc quạc'],['🐸','con ếch','ộp ộp'],
  ['🐑','con cừu','be be'],['🐴','con ngựa','hí hí'],['🦁','sư tử','gầm gừ'],['🐭','con chuột','chít chít']
];
const $ = id => document.getElementById(id);
let score = 0, current = null, locked = false, muted = false, bag = [];
try { muted = localStorage.getItem('animalMuted') === '1'; } catch(e){}

let viVoice = null;
function loadVoice(){ viVoice = (speechSynthesis.getVoices()||[]).find(v=>/^vi/i.test(v.lang)) || null; }
if ('speechSynthesis' in window){ loadVoice(); speechSynthesis.onvoiceschanged = loadVoice; }
function say(text, onend){
  if (muted || !('speechSynthesis' in window)) { if (onend) onend(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'vi-VN'; if (viVoice) u.voice = viVoice; u.rate = .8; u.pitch = 1.2;
  if (onend) u.onend = onend;
  speechSynthesis.speak(u);
}
let ac = null;
function beep(ok){
  if (muted) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(ok?520:220, t);
    if (ok) o.frequency.exponentialRampToValueAtTime(880, t+.12);
    g.gain.setValueAtTime(.25, t); g.gain.exponentialRampToValueAtTime(.01, t+.2);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+.22);
  }catch(e){}
}

/* Bé mới chơi: 2 hình. Sau 8 lần đúng: 3 hình. */
function totalCorrect(){ try { return parseInt(localStorage.getItem('animalCorrect')||'0',10)||0; } catch(e){ return 0; } }
function choiceCount(){ return totalCorrect() < 8 ? 2 : 3; }
function nextAnimal(){
  if (!bag.length) bag = ANIMALS.map((_,i)=>i).sort(()=>Math.random()-.5);
  return ANIMALS[bag.pop()];
}
function question(){ return 'Con nào kêu ' + current[2] + '?'; }

function newRound(){
  locked = false; $('praise').textContent = '';
  current = nextAnimal();
  $('sound').textContent = '“' + current[2] + '”';
  const n = choiceCount();
  const wrong = ANIMALS.filter(a=>a!==current).sort(()=>Math.random()-.5).slice(0,n-1);
  const opts = [current,...wrong].sort(()=>Math.random()-.5);
  const box = $('choices'); box.innerHTML = ''; box.classList.toggle('two', n===2);
  opts.forEach(a=>{
    const b = document.createElement('button');
    b.className = 'choice'; b.textContent = a[0]; b.setAttribute('aria-label', a[1]);
    b.onclick = () => answer(b, a===current);
    box.appendChild(b);
  });
  setTimeout(()=>say(question()), 350);
}
function answer(btn, ok){
  if (locked) return;
  if (!ok){
    if (window.BeTracker) BeTracker.round(false);
    btn.classList.add('wrong'); beep(false); say('Chưa đúng. Bé thử lại nhé!');
    $('praise').textContent = 'Thử lại nhé! 💪'; return;
  }
  if (window.BeTracker) BeTracker.round(true);
  locked = true; btn.classList.add('right'); beep(true);
  try{ localStorage.setItem('animalCorrect', String(totalCorrect()+1)); }catch(e){}
  score++; $('score').textContent = '⭐ ' + score;
  const p = ['Giỏi quá!','Đúng rồi!','Bé tuyệt vời!','Hoan hô!'][Math.floor(Math.random()*4)];
  $('praise').textContent = p + ' 🎉';
  const r = btn.getBoundingClientRect();
  for (let i=0;i<10;i++){
    const s = document.createElement('div'); s.className='star'; s.textContent='⭐';
    s.style.left = (r.left+r.width/2)+'px'; s.style.top = (r.top+r.height/2)+'px';
    s.style.setProperty('--dx',(Math.random()*240-120)+'px'); s.style.setProperty('--dy',(Math.random()*-200-20)+'px');
    document.body.appendChild(s); setTimeout(()=>s.remove(),1200);
  }
  let advanced = false;
  const go = () => { if (advanced) return; advanced = true; setTimeout(newRound, 700); };
  say(p + ' ' + current[1] + ' kêu ' + current[2], go);
  setTimeout(go, 4500);   // phòng khi trình duyệt không báo giọng đọc đã xong
}
$('ask').onclick = () => { if (current) say(question()); };
function renderMute(){ $('mute').textContent = muted ? '🔇 Âm thanh: Tắt' : '🔊 Âm thanh: Bật'; $('mute').setAttribute('aria-pressed', muted); }
$('mute').onclick = () => { muted = !muted; try{localStorage.setItem('animalMuted', muted?'1':'0');}catch(e){}; if (muted && 'speechSynthesis' in window) speechSynthesis.cancel(); renderMute(); };
renderMute(); newRound();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
