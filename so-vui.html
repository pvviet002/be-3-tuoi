<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Số Vui — Bé học về các con số</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#84CC16">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#65A30D;--g-deep:#4D7C0F;--g-lt:#BEF264;--edge:#CFE8A0;--berry:#E84D89;--leaf-deep:#2E9A64;--sun:#FFCB3D;--ink:#4A4458;--soft:#8B85A0}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);min-height:100vh;padding:12px;display:flex;justify-content:center;
  background:linear-gradient(180deg,#E3F9B4 0%,#F4FCE0 55%,#FFF6EC 100%);user-select:none;-webkit-user-select:none;overflow-x:hidden}
.stage{width:100%;max-width:720px;border:8px solid #fff;border-radius:32px;padding:14px 16px 22px;
  background:linear-gradient(180deg,#D4F58B 0%,#F1FCD9 50%,#F1FBEF 100%);box-shadow:0 24px 50px rgba(100,150,20,.28);
  display:flex;flex-direction:column;align-items:center;gap:14px}
.bar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px}
.btn{border:0;cursor:pointer;font:inherit;font-weight:800;border-radius:99px;padding:8px 18px;background:#fff;color:var(--g-deep);
  box-shadow:0 4px 0 rgba(0,0,0,.14);font-size:1rem;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.14)}
.score{font-weight:800;background:var(--sun);color:#7A5C00;border-radius:99px;padding:6px 16px;box-shadow:0 4px 0 #F5A700}
h1{font-size:clamp(1.3rem,5vw,2rem);color:var(--g-deep);text-shadow:0 2px 0 #fff;text-align:center}
.hidden{display:none!important}
.sub{font-weight:700;color:var(--soft);text-align:center}
.menu{display:flex;flex-direction:column;gap:14px;width:100%}
.big{border:5px solid #fff;cursor:pointer;font:inherit;border-radius:28px;padding:16px 20px;display:flex;align-items:center;gap:16px;color:#fff;text-align:left;
  background:linear-gradient(180deg,#9AD94A,var(--g));box-shadow:0 8px 0 var(--g-deep),0 16px 24px rgba(100,150,20,.25)}
.big:nth-of-type(2){background:linear-gradient(180deg,#6FD0E0,#1FA9C0);box-shadow:0 8px 0 #12788A,0 16px 24px rgba(18,120,138,.25)}
.big:nth-of-type(3){background:linear-gradient(180deg,#FFB169,#FF9A3D);box-shadow:0 8px 0 #EE7F14,0 16px 24px rgba(238,127,20,.25)}
.big:active{transform:translateY(4px)}
.big .ico{font-size:2.8rem}
.big b{font-size:1.4rem;display:block;line-height:1.05}
.big span{font-weight:700;font-size:.92rem;opacity:.95}
.ask{display:flex;align-items:center;gap:14px;background:#fff;border-radius:28px;padding:12px 22px;box-shadow:0 6px 0 var(--edge);cursor:pointer;border:0;font:inherit;text-align:left}
.ask .say{font-size:2.2rem}
.ask .txt{font-weight:800;font-size:clamp(1.2rem,5vw,1.7rem);color:var(--berry);line-height:1.1}
.ask:active{transform:translateY(3px)}
.praise{font-weight:800;font-size:1.3rem;color:var(--leaf-deep);min-height:1.8em;text-align:center}
.board{width:100%;display:flex;flex-direction:column;align-items:center;gap:12px}

/* Nhiều hơn / ít hơn */
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%}
.group{border:5px solid #fff;cursor:pointer;background:#fff;border-radius:26px;min-height:min(160px,calc(24 * var(--vh)));padding:12px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  min-width:0;box-shadow:0 7px 0 var(--edge),0 14px 22px rgba(100,150,20,.18);font:inherit;animation:pop .4s cubic-bezier(.34,1.5,.5,1) both}
.group:active{transform:translateY(4px)}
.group .items{display:flex;flex-wrap:wrap;gap:2px 4px;justify-content:center;align-content:center;line-height:1.05}
.group .total{font-size:2rem;font-weight:800;color:var(--g);min-height:2.3rem}
.group.right{outline:6px solid var(--sun);animation:bounce .6s}
.group.wrong{animation:shake .4s;opacity:.45}

/* Số còn thiếu */
.seq{display:flex;gap:8px;justify-content:center;flex-wrap:nowrap;width:100%}
.tile{width:min(17vw,calc(11 * var(--vh)),84px);flex:none;aspect-ratio:1;border-radius:20px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:min(11vw,48px);font-weight:800;color:var(--g-deep);
  box-shadow:0 5px 0 var(--edge)}
.tile.blank{background:#FFF8D6;border:4px dashed #E0B400;color:#C99700;box-shadow:none}
.tile.filled{background:var(--g-lt);color:var(--g-deep);animation:bounce .6s}

/* Cộng bằng hình */
.addrow{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;width:100%}
.addrow .set{background:#fff;border-radius:22px;padding:8px 6px;min-width:64px;min-height:72px;max-width:44%;display:flex;flex-wrap:wrap;gap:2px 4px;justify-content:center;align-content:center;
  box-shadow:0 5px 0 var(--edge);line-height:1.05}
.addrow .op{font-size:1.8rem;font-weight:800;color:var(--g-deep)}
.addrow .res{min-width:64px;min-height:64px;border-radius:20px;background:#FFF8D6;border:4px dashed #E0B400;color:#C99700;font-size:2.6rem;font-weight:800;display:flex;align-items:center;justify-content:center}
.addrow .res.filled{background:var(--g-lt);color:var(--g-deep);border:0;animation:bounce .6s}

.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;max-width:calc(3 * 24 * var(--vh) + 24px);margin-inline:auto}
.choices.two{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:calc(2 * 30 * var(--vh) + 14px)}
.choice{aspect-ratio:1;border:0;cursor:pointer;background:#fff;border-radius:28px;border:5px solid #fff;font-size:min(14vw,calc(11 * var(--vh)),64px);font-weight:800;color:var(--g);font-family:inherit;min-width:0;padding:0;
  display:flex;align-items:center;justify-content:center;box-shadow:0 7px 0 var(--edge),0 14px 22px rgba(100,150,20,.2);transition:transform .12s;animation:pop .4s cubic-bezier(.34,1.5,.5,1) both}
.choices.two .choice{font-size:min(20vw,calc(15 * var(--vh)),84px)}
.choice:nth-child(2){animation-delay:.07s}.choice:nth-child(3){animation-delay:.14s}
.choice:active{transform:translateY(4px)}
.choice.wrong{animation:shake .4s;opacity:.4}
.choice.right{outline:6px solid var(--sun);animation:bounce .6s}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes bounce{40%{transform:scale(1.14) rotate(-4deg)}70%{transform:scale(.97) rotate(3deg)}}
.star{position:fixed;pointer-events:none;font-size:2rem;animation:fly 1.1s ease-out forwards;z-index:50}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(360deg);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<link rel="stylesheet" href="fit.css">
<script src="tracker.js"></script>
</head>
<body>
<main class="stage">
  <div class="bar">
    <a class="btn" href="index.html" id="home" aria-label="Về trang chủ">🏠 Về nhà</a>
    <button class="btn hidden" id="back" aria-label="Về màn hình chọn">⬅ Chọn lại</button>
    <span class="score hidden" id="score" aria-live="polite">⭐ 0</span>
  </div>
  <h1>Số Vui</h1>

  <section class="menu" id="menu">
    <p class="sub">Bé chọn một trò chơi với các con số nhé!</p>
    <button class="big" data-mode="more"><span class="ico">⚖️</span><div><b>Nhiều hơn – Ít hơn</b><span>Bên nào có nhiều (hoặc ít) hơn?</span></div></button>
    <button class="big" data-mode="missing"><span class="ico">🔍</span><div><b>Số còn thiếu</b><span>Điền số vào chỗ trống</span></div></button>
    <button class="big" data-mode="add"><span class="ico">➕</span><div><b>Cộng bằng hình</b><span>Gộp lại có tất cả mấy?</span></div></button>
  </section>

  <section class="menu hidden" id="play" style="align-items:center">
    <button class="ask" id="ask" aria-label="Nghe lại câu hỏi"><span class="say">🔊</span><span class="txt" id="qtext"></span></button>
    <div class="board" id="board"></div>
    <div class="praise" id="praise" aria-live="polite"></div>
    <div class="choices hidden" id="choices"></div>
  </section>

  <button class="btn" id="mute" aria-pressed="false">🔊 Âm thanh: Bật</button>
</main>

<script>
const $ = id => document.getElementById(id);
const NUM = ['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín','mười'];
const THINGS = ['🍎','🐶','⭐','🎈','🍌','🐱','🚗','🌸','🦆','🍓'];
const PRAISES = ['Giỏi quá!','Đúng rồi!','Bé tuyệt vời!','Hoan hô!'];
let muted = false, mode = null, score = 0, locked = false, ans = null, qSpeech = '', lastThing = null;
try { muted = localStorage.getItem('numMuted') === '1'; } catch(e){}

/* ── Giọng đọc tiếng Việt + tiếng bíp ── */
let viVoice = null;
function loadVoice(){ viVoice = (speechSynthesis.getVoices()||[]).find(v=>/^vi/i.test(v.lang)) || null; }
if ('speechSynthesis' in window){ loadVoice(); speechSynthesis.onvoiceschanged = loadVoice; }
function say(text, onend){
  if (muted || !('speechSynthesis' in window)) { if (onend) onend(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'vi-VN'; if (viVoice) u.voice = viVoice; u.rate = .8; u.pitch = 1.2;
  if (onend) u.onend = onend;
  speechSynthesis.speak(u);
}
let ac = null;
function beep(ok){
  if (muted) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(ok?520:220, t);
    if (ok) o.frequency.exponentialRampToValueAtTime(880, t+.12);
    g.gain.setValueAtTime(.25, t); g.gain.exponentialRampToValueAtTime(.01, t+.2);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+.22);
  }catch(e){}
}

/* ── Mức độ: dưới 8 lần đúng dùng số tới 5 và 2 lựa chọn; từ 8 lần đúng dùng số tới 10 và 3 lựa chọn ── */
function totalCorrect(){ try { return parseInt(localStorage.getItem('numberCorrect')||'0',10)||0; } catch(e){ return 0; } }
const maxN = () => totalCorrect() < 8 ? 5 : 10;
const choiceCount = () => totalCorrect() < 8 ? 2 : 3;
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const shuffle = a => a.sort(() => Math.random() - .5);
function pickThing(){ let t; do { t = THINGS[rnd(0, THINGS.length-1)]; } while (t === lastThing); lastThing = t; return t; }
/* Mỗi hình là một phần tử riêng để luôn xuống dòng được (chuỗi emoji liền nhau đôi khi không ngắt dòng và tràn khỏi thẻ) */
function group(thing, n){ return Array.from({length:n}, () => '<span>' + thing + '</span>').join(''); }
const sizeFor = n => n <= 4 ? '2.6rem' : (n <= 6 ? '2.1rem' : '1.7rem');
/* Đáp án nhiễu là số gần số đúng để bé phải nghĩ thật */
function numChoices(correct, lo, hi, k){
  const near = [], far = [];
  for (let i = lo; i <= hi; i++) if (i !== correct) (Math.abs(i - correct) <= 2 ? near : far).push(i);
  return shuffle([correct, ...shuffle(near).concat(shuffle(far)).slice(0, k - 1)]);
}

/* ── Màn hình ── */
function show(name){
  $('menu').classList.toggle('hidden', name !== 'menu');
  $('play').classList.toggle('hidden', name !== 'play');
  $('back').classList.toggle('hidden', name === 'menu');
  $('home').classList.toggle('hidden', name !== 'menu');
  $('score').classList.toggle('hidden', name !== 'play');
  if ('speechSynthesis' in window) speechSynthesis.cancel();
}
$('back').onclick = () => show('menu');
document.querySelectorAll('.big').forEach(b => b.onclick = () => { mode = b.dataset.mode; score = 0; $('score').textContent = '⭐ 0'; lastThing = null; show('play'); newRound(); });
$('ask').onclick = () => { if (qSpeech) say(qSpeech); };

/* ── Vòng chơi ── */
function setQuestion(text){ $('qtext').textContent = text; qSpeech = text; setTimeout(() => say(text), 350); }
function newRound(){
  locked = false; $('praise').textContent = '';
  const board = $('board'), choices = $('choices');
  board.innerHTML = ''; choices.innerHTML = '';
  if (mode === 'more') roundMore(board);
  else if (mode === 'missing') roundMissing(board, choices);
  else roundAdd(board, choices);
}

/* Nhiều hơn / ít hơn: bé chạm vào nhóm đúng */
function roundMore(board){
  $('choices').classList.add('hidden');
  const c = totalCorrect(), M = maxN();
  const less = c >= 4 && Math.random() < .4;        // từ 4 lần đúng có thêm câu "ít hơn"
  let a, b; do { a = rnd(1, M); b = rnd(1, M); } while (a === b || (c < 8 && Math.abs(a - b) < 2));
  const thing = pickThing();
  ans = less ? Math.min(a, b) : Math.max(a, b);
  const duo = document.createElement('div'); duo.className = 'duo';
  [a, b].forEach(n => {
    const g = document.createElement('button'); g.className = 'group'; g.setAttribute('aria-label', 'nhóm đồ vật');
    g.innerHTML = '<div class="items" style="font-size:' + sizeFor(Math.max(a, b)) + '">' + group(thing, n) + '</div><div class="total"></div>';
    g.onclick = () => answerMore(g, n, a, b, less);
    duo.appendChild(g);
  });
  board.appendChild(duo);
  setQuestion(less ? 'Bên nào có ít hơn?' : 'Bên nào có nhiều hơn?');
}
function answerMore(g, n, a, b, less){
  if (locked) return;
  if (n !== ans) return wrong(g);
  [...document.querySelectorAll('.group')].forEach((el, i) => { el.querySelector('.total').textContent = i === 0 ? a : b; });
  const hi = Math.max(a, b), lo = Math.min(a, b);
  correct(g, less ? NUM[lo] + ' ít hơn ' + NUM[hi] + '.' : NUM[hi] + ' nhiều hơn ' + NUM[lo] + '.');
}

/* Số còn thiếu: điền số vào chỗ trống */
function roundMissing(board, choices){
  choices.classList.remove('hidden');
  const c = totalCorrect(), M = maxN();
  const start = rnd(1, M - 3);
  const seq = [start, start + 1, start + 2, start + 3];
  const hole = c < 8 ? rnd(1, 2) : rnd(0, 3);          // lúc đầu chỉ giấu số ở giữa
  ans = seq[hole];
  const row = document.createElement('div'); row.className = 'seq'; row.id = 'seq';
  seq.forEach((n, i) => { const t = document.createElement('div'); t.className = 'tile' + (i === hole ? ' blank' : ''); t.textContent = i === hole ? '?' : n; row.appendChild(t); });
  board.appendChild(row);
  window._seq = seq; window._hole = hole;
  buildChoices(numChoices(ans, 1, M, choiceCount()), n => n === ans,
    () => { const t = document.querySelectorAll('#seq .tile')[hole]; t.textContent = ans; t.className = 'tile filled'; return seq.map(n => NUM[n]).join(', ') + '.'; });
  setQuestion('Số nào còn thiếu?');
}

/* Cộng bằng hình: gộp hai nhóm */
function roundAdd(board, choices){
  choices.classList.remove('hidden');
  const M = maxN();
  const a = rnd(1, M - 1), b = rnd(1, M - a);
  ans = a + b;
  const thing = pickThing(), sz = ans <= 3 ? '2.4rem' : (ans <= 6 ? '1.9rem' : '1.5rem');
  const row = document.createElement('div'); row.className = 'addrow';
  row.innerHTML = '<div class="set" style="font-size:' + sz + '">' + group(thing, a) + '</div><div class="op">+</div>' +
    '<div class="set" style="font-size:' + sz + '">' + group(thing, b) + '</div><div class="op">=</div><div class="res" id="res">?</div>';
  board.appendChild(row);
  buildChoices(numChoices(ans, 1, M, choiceCount()), n => n === ans,
    () => { const r = $('res'); r.textContent = ans; r.classList.add('filled'); return NUM[a] + ' cộng ' + NUM[b] + ' bằng ' + NUM[ans] + '.'; });
  setQuestion(NUM[a][0].toUpperCase() + NUM[a].slice(1) + ' cộng ' + NUM[b] + ' bằng mấy?');
}

function buildChoices(values, isRight, reveal){
  const box = $('choices'); box.innerHTML = ''; box.classList.toggle('two', values.length === 2);
  values.forEach(v => {
    const b = document.createElement('button'); b.className = 'choice'; b.textContent = v; b.setAttribute('aria-label', NUM[v]);
    b.onclick = () => { if (locked) return; if (!isRight(v)) return wrong(b); const sentence = reveal(); correct(b, sentence); };
    box.appendChild(b);
  });
}

/* ── Chấm đúng / sai ── */
function wrong(el){
  if (window.BeTracker) BeTracker.round(false);
  el.classList.add('wrong'); beep(false); say('Chưa đúng. Bé thử lại nhé!');
  $('praise').textContent = 'Thử lại nhé! 💪';
}
function correct(el, sentence){
  if (window.BeTracker) BeTracker.round(true);
  locked = true; el.classList.add('right'); beep(true);
  try { localStorage.setItem('numberCorrect', String(totalCorrect() + 1)); } catch(e){}
  score++; $('score').textContent = '⭐ ' + score;
  const p = PRAISES[Math.floor(Math.random() * PRAISES.length)];
  $('praise').textContent = p + ' 🎉';
  const r = el.getBoundingClientRect();
  for (let i = 0; i < 10; i++){
    const s = document.createElement('div'); s.className = 'star'; s.textContent = '⭐';
    s.style.left = (r.left + r.width/2) + 'px'; s.style.top = (r.top + r.height/2) + 'px';
    s.style.setProperty('--dx', (Math.random()*240 - 120) + 'px'); s.style.setProperty('--dy', (Math.random()*-200 - 20) + 'px');
    document.body.appendChild(s); setTimeout(() => s.remove(), 1200);
  }
  let advanced = false;
  const go = () => { if (advanced) return; advanced = true; setTimeout(newRound, 800); };
  say(p + ' ' + sentence, go);
  setTimeout(go, 6000);   // phòng khi trình duyệt không báo giọng đọc đã xong
}

function renderMute(){ $('mute').textContent = muted ? '🔇 Âm thanh: Tắt' : '🔊 Âm thanh: Bật'; $('mute').setAttribute('aria-pressed', muted); }
$('mute').onclick = () => { muted = !muted; try { localStorage.setItem('numMuted', muted ? '1' : '0'); } catch(e){}; if (muted && 'speechSynthesis' in window) speechSynthesis.cancel(); renderMute(); };
renderMute(); show('menu');
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
