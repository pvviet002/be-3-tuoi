<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Lật Thẻ — Bé tìm hai thẻ giống nhau</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#A78BFA">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#8B5CF6;--p-deep:#6D28D9;--leaf:#22C55E;--leaf-deep:#15803D;--sun:#FFCB3D;--berry:#E84D89;--ink:#4A4458}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);min-height:100vh;padding:12px;display:flex;justify-content:center;
  background:linear-gradient(180deg,#DDD0FF 0%,#F3EEFF 55%,#FFF6EC 100%);user-select:none;-webkit-user-select:none;overflow-x:hidden}
.stage{width:100%;max-width:720px;border:8px solid #fff;border-radius:32px;padding:14px 16px 22px;
  background:linear-gradient(180deg,#C9B6FF 0%,#EEE8FF 50%,#F6F0FF 100%);box-shadow:0 24px 50px rgba(109,40,217,.28);
  display:flex;flex-direction:column;align-items:center;gap:14px}
.bar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px}
.btn{border:0;cursor:pointer;font:inherit;font-weight:800;border-radius:99px;padding:8px 18px;background:#fff;color:var(--p-deep);
  box-shadow:0 4px 0 rgba(0,0,0,.14);font-size:1rem;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.14)}
.btn.go{background:var(--p);color:#fff;box-shadow:0 4px 0 var(--p-deep)}
.btn.go.pulse{animation:pulse .9s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.score{font-weight:800;background:var(--sun);color:#7A5C00;border-radius:99px;padding:6px 16px;box-shadow:0 4px 0 #F5A700}
h1{font-size:clamp(1.3rem,5vw,2rem);color:var(--p-deep);text-shadow:0 2px 0 #fff;text-align:center}
.hint{display:flex;align-items:center;gap:10px;background:#fff;border-radius:24px;padding:8px 20px;box-shadow:0 5px 0 #CDBDF7;cursor:pointer;border:0;font:inherit;text-align:left}
.hint .say{font-size:1.7rem}
.hint .txt{font-weight:800;font-size:clamp(1rem,4vw,1.35rem);color:var(--ink);line-height:1.15}
.hint:active{transform:translateY(3px)}
.praise{font-weight:800;font-size:1.3rem;color:var(--leaf-deep);min-height:1.8em;text-align:center}
.board{--cs:110px;--gap:10px;display:grid;grid-template-columns:repeat(var(--cols,2),var(--cs));gap:var(--gap);justify-content:center}
.tile{width:var(--cs);height:var(--cs);border:0;background:none;padding:0;cursor:pointer;perspective:700px;font:inherit}
.tile-in{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .35s}
.tile.up .tile-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:calc(var(--cs)*.16);display:flex;flex-direction:column;align-items:center;justify-content:center;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 6px 0 rgba(0,0,0,.14)}
.back{background:linear-gradient(145deg,#A78BFA,var(--p));border:4px solid #fff;color:#fff;font-weight:800;font-size:calc(var(--cs)*.5)}
.back::after{content:"";position:absolute;inset:7px;border-radius:calc(var(--cs)*.11);border:3px dashed rgba(255,255,255,.55)}
.front{background:#fff;border:4px solid #CDBDF7;transform:rotateY(180deg);gap:0}
.front .em{font-size:calc(var(--cs)*.5);line-height:1}
.front .nm{font-weight:800;font-size:calc(var(--cs)*.15);color:var(--ink);line-height:1.1;margin-top:2px;text-align:center}
.small .front .nm{display:none}
.tile.done .front{background:#ECFDF5;border-color:var(--leaf);box-shadow:0 0 0 4px rgba(34,197,94,.25),0 6px 0 rgba(0,0,0,.14)}
.tile.done .tile-in{animation:happy .6s}
@keyframes happy{40%{transform:rotateY(180deg) scale(1.12)}70%{transform:rotateY(180deg) scale(.97)}}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.star{position:fixed;pointer-events:none;font-size:2rem;animation:fly 1.1s ease-out forwards;z-index:50}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(360deg);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<link rel="stylesheet" href="fit.css">
<script src="tracker.js"></script>
</head>
<body>
<main class="stage">
  <div class="bar">
    <a class="btn" href="index.html" aria-label="Về trang chủ">🏠 Về nhà</a>
    <span class="score" id="score" aria-live="polite">⭐ 0</span>
  </div>
  <h1>Lật Thẻ</h1>
  <button class="hint" id="hint" aria-label="Nghe lại lời nhắc">
    <span class="say">🔊</span><span class="txt" id="hint-txt">Bé tìm hai thẻ giống nhau nhé!</span>
  </button>
  <div class="praise" id="praise" aria-live="polite"></div>
  <div class="board" id="board"></div>
  <div class="row">
    <button class="btn go" id="next">▶ Ván mới</button>
    <button class="btn" id="mute" aria-pressed="false">🔊 Âm thanh: Bật</button>
  </div>
</main>

<script>
/* [tên đọc, hình] */
const ITEMS = [
  ['con mèo','🐱'],['con chó','🐶'],['con cá','🐟'],['con gà','🐔'],['con voi','🐘'],['con ếch','🐸'],
  ['quả táo','🍎'],['quả chuối','🍌'],['quả cam','🍊'],['chùm nho','🍇'],
  ['xe hơi','🚗'],['xe buýt','🚌'],['quả bóng','⚽'],['bông hoa','🌸'],['ngôi sao','⭐'],['mặt trời','☀️'],['ngôi nhà','🏠'],['bóng bay','🎈']
];
const $ = id => document.getElementById(id);
let score = 0, muted = false, cards = [], tiles = [], first = null, locked = true, found = 0, gameId = 0, L = null;
try { muted = localStorage.getItem('memoryMuted') === '1'; } catch(e){}

let viVoice = null;
function loadVoice(){ viVoice = (speechSynthesis.getVoices()||[]).find(v=>/^vi/i.test(v.lang)) || null; }
if ('speechSynthesis' in window){ loadVoice(); speechSynthesis.onvoiceschanged = loadVoice; }
function say(text, onend){
  if (muted || !('speechSynthesis' in window)) { if (onend) onend(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'vi-VN'; if (viVoice) u.voice = viVoice; u.rate = .8; u.pitch = 1.2;
  if (onend) u.onend = onend;
  speechSynthesis.speak(u);
}
let ac = null;
function beep(ok){
  if (muted) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(ok?520:260, t);
    if (ok) o.frequency.exponentialRampToValueAtTime(880, t+.12);
    g.gain.setValueAtTime(.22, t); g.gain.exponentialRampToValueAtTime(.01, t+.2);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+.22);
  }catch(e){}
}

/* Học tăng dần theo số cặp thẻ bé đã tìm được (lưu trên thiết bị):
   dưới 4 cặp: 2 cặp (4 thẻ); dưới 10: 3 cặp; dưới 20: 4 cặp; sau đó 6 cặp (12 thẻ).
   Các mức đầu cho bé nhìn trước các thẻ vài giây, mức cuối thì không. */
function pairsDone(){ try { return parseInt(localStorage.getItem('memoryPairs')||'0',10)||0; } catch(e){ return 0; } }
function level(){
  const n = pairsDone();
  if (n < 4)  return {pairs:2, cols:2, peek:2200};
  if (n < 10) return {pairs:3, cols:3, peek:2600};
  if (n < 20) return {pairs:4, cols:4, peek:3000};
  return {pairs:6, cols:4, peek:0};
}
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

/* Chọn cỡ thẻ lớn nhất mà cả màn hình vẫn không phải cuộn */
function fit(){
  if (!L) return;
  const board = $('board'), gap = innerHeight < 800 ? 8 : 10;
  board.style.setProperty('--gap', gap + 'px');
  const w = board.parentElement.clientWidth - 8, n = cards.length;
  const set = v => { board.style.setProperty('--cs', v + 'px'); board.classList.toggle('small', v < 76); };
  /* Thử vài cách xếp (ví dụ 4 cột x 3 hàng hay 3 cột x 4 hàng), lấy cách cho thẻ to nhất */
  const opts = [L.cols].concat(n === 12 ? [3] : n === 8 ? [2] : []);
  let best = null;
  opts.forEach(cols => {
    board.style.setProperty('--cols', cols);
    let cs = Math.max(56, Math.min(170, Math.floor((w - (cols-1)*gap) / cols)));
    set(cs);
    for (let g = 0; g < 80 && cs - 4 >= 56 && document.documentElement.scrollHeight > innerHeight + 1; g++){ cs -= 4; set(cs); }
    const over = Math.max(0, document.documentElement.scrollHeight - innerHeight - 1);   /* phần phải cuộn, 0 = vừa màn hình */
    if (!best || over < best.over || (over === best.over && cs > best.cs)) best = {cols, cs, over};
  });
  board.style.setProperty('--cols', best.cols); set(best.cs);
}

function newGame(){
  gameId++; const id = gameId;
  L = level(); first = null; found = 0; locked = true;
  const picks = shuffle(ITEMS).slice(0, L.pairs);
  cards = shuffle(picks.concat(picks)).map(it => ({it, state:'down'}));
  const board = $('board'); board.innerHTML = ''; board.style.setProperty('--cols', L.cols);
  tiles = cards.map((c, i) => {
    const b = document.createElement('button');
    b.className = 'tile'; b.setAttribute('aria-label', 'thẻ úp');
    b.innerHTML = '<span class="tile-in"><span class="face back">?</span><span class="face front"><span class="em">' + c.it[1] + '</span><span class="nm">' + c.it[0] + '</span></span></span>';
    b.onclick = () => tap(i);
    board.appendChild(b); return b;
  });
  $('praise').textContent = ''; $('next').classList.remove('pulse');
  fit();
  if (L.peek){
    tiles.forEach(t => t.classList.add('up'));
    $('hint-txt').textContent = 'Bé nhìn kỹ các thẻ nhé!';
    setTimeout(() => say('Bé nhìn kỹ các thẻ nhé!'), 300);
    setTimeout(() => {
      if (id !== gameId) return;
      tiles.forEach(t => t.classList.remove('up'));
      $('hint-txt').textContent = 'Bé tìm hai thẻ giống nhau nhé!';
      say('Bé tìm hai thẻ giống nhau nhé!'); locked = false;
    }, L.peek);
  } else {
    $('hint-txt').textContent = 'Bé tìm hai thẻ giống nhau nhé!';
    locked = false; setTimeout(() => say('Bé tìm hai thẻ giống nhau nhé!'), 300);
  }
}

function setFace(i, up){
  tiles[i].classList.toggle('up', up);
  tiles[i].setAttribute('aria-label', up ? cards[i].it[0] : 'thẻ úp');
}
function tap(i){
  if (locked || !cards[i] || cards[i].state !== 'down') return;
  const c = cards[i], id = gameId;
  c.state = 'up'; setFace(i, true); beep(true);
  if (first === null){ first = i; say(c.it[0]); return; }
  const j = first; first = null;
  if (cards[j].it === c.it){
    cards[j].state = c.state = 'done';
    tiles[j].classList.add('done'); tiles[i].classList.add('done');
    if (window.BeTracker) BeTracker.round(true);
    try { localStorage.setItem('memoryPairs', String(pairsDone()+1)); } catch(e){}
    score++; found++; $('score').textContent = '⭐ ' + score;
    const p = ['Giỏi quá!','Đúng rồi!','Bé tuyệt vời!','Hoan hô!'][Math.floor(Math.random()*4)];
    $('praise').textContent = p + ' 🎉';
    if (found === L.pairs) finish(i, id);
    else say(p + ' Hai ' + c.it[0] + ' giống nhau.');
  } else {
    locked = true;
    if (window.BeTracker) BeTracker.round(false);
    $('praise').textContent = 'Chưa giống nhau. Thử lại nhé! 💪';
    say(c.it[0]); setTimeout(() => beep(false), 400);
    setTimeout(() => {
      if (id !== gameId) return;
      cards[j].state = c.state = 'down'; setFace(j, false); setFace(i, false);
      $('praise').textContent = ''; locked = false;
    }, 1300);
  }
}
function finish(i, id){
  locked = true;
  const r = tiles[i].getBoundingClientRect();
  for (let k=0;k<12;k++){
    const s = document.createElement('div'); s.className='star'; s.textContent='⭐';
    s.style.left = (r.left+r.width/2)+'px'; s.style.top = (r.top+r.height/2)+'px';
    s.style.setProperty('--dx',(Math.random()*280-140)+'px'); s.style.setProperty('--dy',(Math.random()*-220-20)+'px');
    document.body.appendChild(s); setTimeout(()=>s.remove(),1200);
  }
  $('praise').textContent = 'Bé tìm được hết rồi! 🎉';
  $('next').classList.add('pulse');
  let advanced = false;
  const go = () => { if (advanced || id !== gameId) return; advanced = true; setTimeout(() => { if (id === gameId) newGame(); }, 1800); };
  say('Hoan hô! Bé tìm được hết rồi!', go);
  setTimeout(go, 6000);   // phòng khi trình duyệt không báo giọng đọc đã xong
}

$('hint').onclick = () => say(L && L.peek && locked ? 'Bé nhìn kỹ các thẻ nhé!' : 'Bé tìm hai thẻ giống nhau nhé!');
$('next').onclick = () => newGame();
function renderMute(){ $('mute').textContent = muted ? '🔇 Âm thanh: Tắt' : '🔊 Âm thanh: Bật'; $('mute').setAttribute('aria-pressed', muted); }
$('mute').onclick = () => { muted = !muted; try{localStorage.setItem('memoryMuted', muted?'1':'0');}catch(e){}; if (muted && 'speechSynthesis' in window) speechSynthesis.cancel(); renderMute(); };
addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 250));
renderMute(); newGame();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
