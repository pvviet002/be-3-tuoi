<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Hình Khối — Bé tìm hình đúng</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7C83F7">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ind:#5B63E0;--ind-deep:#434BC4;--leaf-deep:#2E9A64;--berry:#E84D89;--sun:#FFCB3D;--ink:#4A4458}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);min-height:100vh;padding:12px;display:flex;justify-content:center;
  background:linear-gradient(180deg,#D4D7FF 0%,#EEF0FF 55%,#FFF6EC 100%);user-select:none;-webkit-user-select:none;overflow-x:hidden}
.stage{width:100%;max-width:720px;border:8px solid #fff;border-radius:32px;padding:14px 16px 22px;
  background:linear-gradient(180deg,#B9BEFF 0%,#E9EBFF 50%,#F1FBEF 100%);box-shadow:0 24px 50px rgba(80,90,200,.3);
  display:flex;flex-direction:column;align-items:center;gap:14px}
.bar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px}
.btn{border:0;cursor:pointer;font:inherit;font-weight:800;border-radius:99px;padding:8px 18px;background:#fff;color:var(--ind-deep);
  box-shadow:0 4px 0 rgba(0,0,0,.14);font-size:1rem;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.14)}
.score{font-weight:800;background:var(--sun);color:#7A5C00;border-radius:99px;padding:6px 16px;box-shadow:0 4px 0 #F5A700}
h1{font-size:clamp(1.3rem,5vw,2rem);color:var(--ind-deep);text-shadow:0 2px 0 #fff;text-align:center}
.ask{display:flex;align-items:center;gap:14px;background:#fff;border-radius:28px;padding:12px 22px;box-shadow:0 6px 0 #C3C7F5;cursor:pointer;border:0;font:inherit;text-align:left}
.ask .say{font-size:2.2rem}
.ask .txt{font-weight:800;font-size:clamp(1.1rem,4.4vw,1.6rem);color:var(--ink);line-height:1.1}
.ask .name{display:block;font-size:clamp(2rem,8vw,3.2rem);font-weight:800;color:var(--berry);line-height:1}
.ask .eg{display:block;font-size:.95rem;font-weight:700;color:#8B85A0;margin-top:2px}
.ask:active{transform:translateY(3px)}
.praise{font-weight:800;font-size:1.3rem;color:var(--leaf-deep);min-height:1.8em;text-align:center}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;max-width:calc(3 * 26 * var(--vh) + 24px);margin-inline:auto}
.choices.two{grid-template-columns:repeat(2,minmax(0,1fr));max-width:calc(2 * 32 * var(--vh) + 12px)}
.choice{aspect-ratio:1;cursor:pointer;background:#fff;border-radius:28px;border:5px solid #fff;padding:16%;
  display:flex;align-items:center;justify-content:center;box-shadow:0 7px 0 #C3C7F5,0 14px 22px rgba(80,90,200,.2);
  transition:transform .12s;animation:pop .4s cubic-bezier(.34,1.5,.5,1) both}
.choice svg{width:100%;height:100%;overflow:visible}
.choice:nth-child(2){animation-delay:.07s}.choice:nth-child(3){animation-delay:.14s}
.choice:active{transform:translateY(4px)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.choice.wrong{animation:shake .4s;opacity:.4}
.choice.right{outline:6px solid var(--sun);animation:bounce .6s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes bounce{40%{transform:scale(1.14) rotate(-4deg)}70%{transform:scale(.97) rotate(3deg)}}
.star{position:fixed;pointer-events:none;font-size:2rem;animation:fly 1.1s ease-out forwards;z-index:50}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(360deg);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<link rel="stylesheet" href="fit.css">
<script src="tracker.js"></script>
</head>
<body>
<main class="stage">
  <div class="bar">
    <a class="btn" href="index.html" aria-label="Về trang chủ">🏠 Về nhà</a>
    <span class="score" id="score" aria-live="polite">⭐ 0</span>
  </div>
  <h1>Hình Khối</h1>
  <button class="ask" id="ask" aria-label="Nghe lại câu hỏi">
    <span class="say">🔊</span>
    <span class="txt">Bé tìm<span class="name" id="sname"></span><span class="eg" id="seg"></span></span>
  </button>
  <div class="praise" id="praise" aria-live="polite"></div>
  <div class="choices" id="choices"></div>
  <button class="btn" id="mute" aria-pressed="false">🔊 Âm thanh: Bật</button>
</main>

<script>
/* [tên, hình vẽ SVG, gợi ý, đồ vật]  — xếp theo thứ tự học: hình đơn giản trước */
const STROKE = 'stroke-linejoin="round" stroke="rgba(0,0,0,.12)" stroke-width="3"';
const SHAPES = [
  ['hình tròn',    c=>`<circle cx="50" cy="50" r="44" fill="${c}" ${STROKE}/>`, '☀️', 'mặt trời'],
  ['hình vuông',   c=>`<rect x="9" y="9" width="82" height="82" rx="7" fill="${c}" ${STROKE}/>`, '🪟', 'cửa sổ'],
  ['hình tam giác',c=>`<polygon points="50,7 95,90 5,90" fill="${c}" ${STROKE}/>`, '🍕', 'miếng bánh pizza'],
  ['hình chữ nhật',c=>`<rect x="3" y="24" width="94" height="52" rx="7" fill="${c}" ${STROKE}/>`, '🚪', 'cánh cửa'],
  ['ngôi sao',     c=>`<polygon points="50,5 62,37 96,38 69,59 79,93 50,73 21,93 31,59 4,38 38,37" fill="${c}" ${STROKE}/>`, '🌟', 'ngôi sao trên trời'],
  ['trái tim',     c=>`<path d="M50 90C20 67 5 49 5 32 5 17 17 7 31 7c9 0 16 5 19 12 3-7 10-12 19-12 14 0 26 10 26 25 0 17-15 35-45 58z" fill="${c}" ${STROKE}/>`, '❤️', 'trái tim'],
  ['hình bầu dục', c=>`<ellipse cx="50" cy="50" rx="46" ry="31" fill="${c}" ${STROKE}/>`, '🥚', 'quả trứng'],
  ['hình thoi',    c=>`<polygon points="50,4 94,50 50,96 6,50" fill="${c}" ${STROKE}/>`, '🪁', 'cánh diều']
];
const PALETTE = ['#EF4444','#3B82F6','#22C55E','#F59E0B','#8B5CF6','#EC4899','#14B8A6'];
const $ = id => document.getElementById(id);
let score = 0, current = null, locked = false, muted = false, recent = [];
try { muted = localStorage.getItem('shapeMuted') === '1'; } catch(e){}

let viVoice = null;
function loadVoice(){ viVoice = (speechSynthesis.getVoices()||[]).find(v=>/^vi/i.test(v.lang)) || null; }
if ('speechSynthesis' in window){ loadVoice(); speechSynthesis.onvoiceschanged = loadVoice; }
function say(text, onend){
  if (muted || !('speechSynthesis' in window)) { if (onend) onend(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'vi-VN'; if (viVoice) u.voice = viVoice; u.rate = .8; u.pitch = 1.2;
  if (onend) u.onend = onend;
  speechSynthesis.speak(u);
}
let ac = null;
function beep(ok){
  if (muted) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(ok?520:220, t);
    if (ok) o.frequency.exponentialRampToValueAtTime(880, t+.12);
    g.gain.setValueAtTime(.25, t); g.gain.exponentialRampToValueAtTime(.01, t+.2);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+.22);
  }catch(e){}
}

/* Học tăng dần: bắt đầu 3 hình (tròn, vuông, tam giác); cứ 3 lần đúng thì thêm 1 hình (tối đa 8).
   Dưới 5 hình: 2 lựa chọn; từ 5 hình: 3 lựa chọn. Tiến độ lưu trên thiết bị. */
function totalCorrect(){ try { return parseInt(localStorage.getItem('shapeCorrect')||'0',10)||0; } catch(e){ return 0; } }
function pool(){ return SHAPES.slice(0, Math.min(SHAPES.length, 3 + Math.floor(totalCorrect()/3))); }
function choiceCount(){ return pool().length < 5 ? 2 : 3; }
function nextShape(){
  const p = pool(), keep = Math.min(2, p.length-2);
  const c = p.filter(x=>!recent.includes(x));
  const pick = c[Math.floor(Math.random()*c.length)];
  recent.push(pick); while (recent.length > keep) recent.shift();
  return pick;
}
function question(){ return 'Bé tìm ' + current[0] + ' nào! ' + cap(current[0]) + ' giống ' + current[3] + '.'; }
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

function newRound(){
  locked = false; $('praise').textContent = '';
  current = nextShape();
  $('sname').textContent = current[0];
  $('seg').textContent = current[2] + ' giống ' + current[3];
  const color = PALETTE[Math.floor(Math.random()*PALETTE.length)];   // cả lượt cùng màu để bé nhận ra hình, không đoán theo màu
  const n = choiceCount();
  const wrong = pool().filter(s=>s!==current).sort(()=>Math.random()-.5).slice(0,n-1);
  const opts = [current,...wrong].sort(()=>Math.random()-.5);
  const box = $('choices'); box.innerHTML = ''; box.classList.toggle('two', n===2);
  opts.forEach(s=>{
    const b = document.createElement('button');
    b.className = 'choice'; b.setAttribute('aria-label', s[0]);
    b.innerHTML = '<svg viewBox="0 0 100 100" aria-hidden="true">' + s[1](color) + '</svg>';
    b.onclick = () => answer(b, s===current);
    box.appendChild(b);
  });
  setTimeout(()=>say(question()), 350);
}
function answer(btn, ok){
  if (locked) return;
  if (!ok){
    if (window.BeTracker) BeTracker.round(false);
    btn.classList.add('wrong'); beep(false); say('Chưa đúng. Bé thử lại nhé!');
    $('praise').textContent = 'Thử lại nhé! 💪'; return;
  }
  if (window.BeTracker) BeTracker.round(true);
  locked = true; btn.classList.add('right'); beep(true);
  try{ localStorage.setItem('shapeCorrect', String(totalCorrect()+1)); }catch(e){}
  score++; $('score').textContent = '⭐ ' + score;
  const p = ['Giỏi quá!','Đúng rồi!','Bé tuyệt vời!','Hoan hô!'][Math.floor(Math.random()*4)];
  $('praise').textContent = p + ' 🎉';
  const r = btn.getBoundingClientRect();
  for (let i=0;i<10;i++){
    const s = document.createElement('div'); s.className='star'; s.textContent='⭐';
    s.style.left = (r.left+r.width/2)+'px'; s.style.top = (r.top+r.height/2)+'px';
    s.style.setProperty('--dx',(Math.random()*240-120)+'px'); s.style.setProperty('--dy',(Math.random()*-200-20)+'px');
    document.body.appendChild(s); setTimeout(()=>s.remove(),1200);
  }
  let advanced = false;
  const go = () => { if (advanced) return; advanced = true; setTimeout(newRound, 700); };
  say(p + ' Đây là ' + current[0] + '.', go);
  setTimeout(go, 4500);   // phòng khi trình duyệt không báo giọng đọc đã xong
}
$('ask').onclick = () => { if (current) say(question()); };
function renderMute(){ $('mute').textContent = muted ? '🔇 Âm thanh: Tắt' : '🔊 Âm thanh: Bật'; $('mute').setAttribute('aria-pressed', muted); }
$('mute').onclick = () => { muted = !muted; try{localStorage.setItem('shapeMuted', muted?'1':'0');}catch(e){}; if (muted && 'speechSynthesis' in window) speechSynthesis.cancel(); renderMute(); };
renderMute(); newRound();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
