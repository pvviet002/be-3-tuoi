<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bé Học Đồ Vật — Nhận biết đồ vật quen thuộc</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#8ED1FF">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#4FA8F5;--blue-deep:#2E86DB;--leaf:#43B97F;--leaf-deep:#2E9A64;--berry:#FF6FA5;--berry-deep:#E84D89;
  --sun:#FFCB3D;--ink:#4A4458;--ink-soft:#8B85A0;--white:#fff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);min-height:100vh;padding:12px;
  background:linear-gradient(180deg,#BFE7FF 0%,#E7F6FF 55%,#FFF3F9 100%);display:flex;justify-content:center;
  user-select:none;-webkit-user-select:none;overflow-x:hidden}
.stage{width:100%;max-width:720px;border:8px solid var(--white);border-radius:32px;padding:14px 16px 22px;
  background:linear-gradient(180deg,#8ED1FF 0%,#E2F5FF 45%,#EFFAEF 100%);box-shadow:0 24px 50px rgba(63,113,170,.35);
  display:flex;flex-direction:column;align-items:center;gap:14px}
.bar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px}
.btn{border:0;cursor:pointer;font:inherit;font-weight:800;border-radius:99px;padding:8px 18px;background:var(--white);
  color:var(--blue-deep);box-shadow:0 4px 0 rgba(0,0,0,.14);font-size:1rem;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.14)}
.score{font-weight:800;background:var(--sun);color:#7A5C00;border-radius:99px;padding:6px 16px;box-shadow:0 4px 0 #F5A700}
h1{font-size:clamp(1.4rem,5vw,2rem);color:var(--blue-deep);text-shadow:0 2px 0 #fff}
.prompt{font-weight:800;font-size:clamp(1.1rem,4vw,1.5rem);text-align:center}
.picture{width:min(62vw,260px);aspect-ratio:1;background:var(--white);border-radius:36px;border:6px solid #fff;
  display:flex;align-items:center;justify-content:center;font-size:min(36vw,150px);cursor:pointer;
  box-shadow:0 8px 0 #BFD9F2,0 16px 28px rgba(46,134,219,.25);animation:pop .45s cubic-bezier(.34,1.5,.5,1) both}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.picture.bounce{animation:bounce .5s}
@keyframes bounce{40%{transform:scale(1.12) rotate(-4deg)}70%{transform:scale(.97) rotate(3deg)}}
.hint{font-size:.85rem;color:var(--ink-soft);font-weight:700}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%}
@media(max-width:480px){.choices{grid-template-columns:1fr}}
.choice{border:0;cursor:pointer;font:inherit;font-weight:800;font-size:clamp(1.15rem,4vw,1.5rem);color:#fff;
  padding:16px 8px;border-radius:24px;border:4px solid #fff;transition:transform .12s}
.choice:nth-child(1){background:linear-gradient(180deg,#FF9BC4,var(--berry));box-shadow:0 6px 0 var(--berry-deep)}
.choice:nth-child(2){background:linear-gradient(180deg,#7FC0FA,var(--blue));box-shadow:0 6px 0 var(--blue-deep)}
.choice:nth-child(3){background:linear-gradient(180deg,#6FD69B,var(--leaf));box-shadow:0 6px 0 var(--leaf-deep)}
.choice:active{transform:translateY(4px)}
.choice.wrong{animation:shake .4s;opacity:.55}
.choice.right{outline:6px solid var(--sun);animation:bounce .5s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.star{position:fixed;pointer-events:none;font-size:2rem;animation:fly 1.1s ease-out forwards;z-index:50}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(360deg);opacity:0}}
.praise{font-weight:800;font-size:1.3rem;color:var(--leaf-deep);min-height:1.8em;text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main class="stage">
  <div class="bar">
    <a class="btn" href="index.html" aria-label="Về trang chủ">🏠 Về nhà</a>
    <h1>Bé Học Đồ Vật</h1>
    <span class="score" id="score" aria-live="polite">⭐ 0</span>
  </div>
  <p class="prompt">Đây là cái gì nhỉ?</p>
  <div class="picture" id="picture" role="img" aria-label="Đồ vật cần đoán"></div>
  <p class="hint">Chạm vào hình để nghe lại 🔊</p>
  <div class="praise" id="praise"></div>
  <div class="choices" id="choices"></div>
  <button class="btn" id="mute" aria-pressed="false">🔊 Âm thanh: Bật</button>
</main>

<script>
const ITEMS = [
  ['🍎','quả táo'],['🍌','quả chuối'],['🍊','quả cam'],['🍇','chùm nho'],['🍉','dưa hấu'],['🍓','quả dâu'],
  ['🐶','con chó'],['🐱','con mèo'],['🐰','con thỏ'],['🐘','con voi'],['🐟','con cá'],['🐔','con gà'],['🐮','con bò'],['🐷','con heo'],
  ['🚗','xe hơi'],['🚌','xe buýt'],['🚲','xe đạp'],['✈️','máy bay'],['⛵','thuyền buồm'],['🚂','tàu hỏa'],
  ['⚽','quả bóng'],['🧸','gấu bông'],['🎈','bóng bay'],['📚','quyển sách'],['✏️','cây bút chì'],['🎒','cặp sách'],
  ['🥄','cái muỗng'],['🍽️','cái đĩa'],['🥛','ly sữa'],['🛏️','cái giường'],['🪑','cái ghế'],['🚪','cái cửa'],
  ['☂️','cái ô'],['👕','cái áo'],['👟','đôi giày'],['🎩','cái mũ'],['⏰','đồng hồ'],['💡','bóng đèn'],
  ['🌞','mặt trời'],['🌙','mặt trăng'],['🌳','cái cây'],['🌸','bông hoa']
];
const $ = id => document.getElementById(id);
let score = 0, current = null, locked = false, muted = false, bag = [];
try { muted = localStorage.getItem('doVatMuted') === '1'; } catch(e){}

/* Giọng đọc tiếng Việt (nếu thiết bị hỗ trợ) */
let viVoice = null;
function loadVoice(){ viVoice = (speechSynthesis.getVoices()||[]).find(v=>/^vi/i.test(v.lang)) || null; }
if ('speechSynthesis' in window){ loadVoice(); speechSynthesis.onvoiceschanged = loadVoice; }
function say(text){
  if (muted || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'vi-VN'; if (viVoice) u.voice = viVoice; u.rate = .85; u.pitch = 1.15;
  speechSynthesis.speak(u);
}
/* Tiếng bíp nhỏ */
let ac = null;
function beep(ok){
  if (muted) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(ok?520:220, t);
    if (ok) o.frequency.exponentialRampToValueAtTime(880, t+.12);
    g.gain.setValueAtTime(.25, t); g.gain.exponentialRampToValueAtTime(.01, t+.2);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+.22);
  }catch(e){}
}

function nextItem(){
  if (!bag.length) bag = ITEMS.map((_,i)=>i).sort(()=>Math.random()-.5);  // hết lượt mới xáo lại, không lặp
  return ITEMS[bag.pop()];
}
function newRound(){
  locked = false; $('praise').textContent = '';
  current = nextItem();
  const pic = $('picture');
  pic.textContent = current[0]; pic.classList.remove('bounce'); pic.style.animation='none'; void pic.offsetWidth; pic.style.animation='';
  const wrong = ITEMS.filter(i=>i!==current).sort(()=>Math.random()-.5).slice(0,2);
  const opts = [current,...wrong].sort(()=>Math.random()-.5);
  $('choices').innerHTML = '';
  opts.forEach(o=>{
    const b = document.createElement('button');
    b.className = 'choice'; b.textContent = o[1];
    b.onclick = () => answer(b, o===current);
    $('choices').appendChild(b);
  });
  setTimeout(()=>say('Đây là cái gì nhỉ?'), 300);
}
function answer(btn, ok){
  if (locked) return;
  if (!ok){ btn.classList.add('wrong'); beep(false); say('Thử lại nhé!'); $('praise').textContent='Thử lại nhé! 💪'; return; }
  locked = true; btn.classList.add('right'); beep(true);
  score++; $('score').textContent = '⭐ ' + score;
  const p = ['Giỏi quá!','Đúng rồi!','Bé tuyệt vời!','Hoan hô!'][Math.floor(Math.random()*4)];
  $('praise').textContent = p + ' 🎉';
  $('picture').classList.add('bounce');
  say(current[1] + '. ' + p);
  const r = btn.getBoundingClientRect();
  for (let i=0;i<10;i++){
    const s = document.createElement('div'); s.className='star'; s.textContent='⭐';
    s.style.left = (r.left+r.width/2)+'px'; s.style.top = (r.top+r.height/2)+'px';
    s.style.setProperty('--dx',(Math.random()*240-120)+'px'); s.style.setProperty('--dy',(Math.random()*-200-20)+'px');
    document.body.appendChild(s); setTimeout(()=>s.remove(),1200);
  }
  setTimeout(newRound, 2200);
}
$('picture').onclick = () => { if (current){ say(current[1]); $('picture').classList.remove('bounce'); void $('picture').offsetWidth; $('picture').classList.add('bounce'); } };
function renderMute(){ $('mute').textContent = muted ? '🔇 Âm thanh: Tắt' : '🔊 Âm thanh: Bật'; $('mute').setAttribute('aria-pressed', muted); }
$('mute').onclick = () => { muted = !muted; try{localStorage.setItem('doVatMuted', muted?'1':'0');}catch(e){}; if (muted && 'speechSynthesis' in window) speechSynthesis.cancel(); renderMute(); };
renderMute(); newRound();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
