<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Học Màu Sắc — Bé chạm bóng bay đúng màu</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5CD6D0">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--teal:#1FA9A3;--teal-deep:#168581;--leaf-deep:#2E9A64;--berry:#E84D89;--sun:#FFCB3D;--ink:#4A4458}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);min-height:100vh;padding:12px;display:flex;justify-content:center;
  background:linear-gradient(180deg,#BDF1EE 0%,#E8FAF8 55%,#FFF6EC 100%);user-select:none;-webkit-user-select:none;overflow-x:hidden}
.stage{width:100%;max-width:720px;border:8px solid #fff;border-radius:32px;padding:14px 16px 22px;
  background:linear-gradient(180deg,#9CE8E3 0%,#E4F9F7 50%,#F1FBEF 100%);box-shadow:0 24px 50px rgba(30,150,145,.3);
  display:flex;flex-direction:column;align-items:center;gap:14px}
.bar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px}
.btn{border:0;cursor:pointer;font:inherit;font-weight:800;border-radius:99px;padding:8px 18px;background:#fff;color:var(--teal-deep);
  box-shadow:0 4px 0 rgba(0,0,0,.14);font-size:1rem;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.14)}
.score{font-weight:800;background:var(--sun);color:#7A5C00;border-radius:99px;padding:6px 16px;box-shadow:0 4px 0 #F5A700}
h1{font-size:clamp(1.3rem,5vw,2rem);color:var(--teal-deep);text-shadow:0 2px 0 #fff;text-align:center}
.ask{display:flex;align-items:center;gap:14px;background:#fff;border-radius:28px;padding:12px 22px;box-shadow:0 6px 0 #A8DDD9;cursor:pointer;border:0;font:inherit;text-align:left}
.ask .say{font-size:2.2rem}
.ask .txt{font-weight:800;font-size:clamp(1.1rem,4.4vw,1.6rem);color:var(--ink);line-height:1.1}
.ask .name{display:block;font-size:clamp(2rem,8vw,3.2rem);font-weight:800;color:var(--berry);line-height:1}
.ask .eg{display:block;font-size:.95rem;font-weight:700;color:#8B85A0;margin-top:2px}
.ask:active{transform:translateY(3px)}
.praise{font-weight:800;font-size:1.3rem;color:var(--leaf-deep);min-height:1.8em;text-align:center}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:100%;justify-items:center}
.choices.two{grid-template-columns:repeat(2,1fr)}
.balloon{width:min(100%,200px);aspect-ratio:1;border:0;cursor:pointer;border-radius:50% 50% 48% 48%;position:relative;
  box-shadow:inset -10px -14px 0 rgba(0,0,0,.12),0 10px 18px rgba(0,0,0,.18);transition:transform .12s;
  animation:pop .4s cubic-bezier(.34,1.5,.5,1) both, floaty 3s ease-in-out infinite alternate}
.balloon::before{content:"";position:absolute;top:14%;left:20%;width:24%;height:18%;border-radius:50%;background:rgba(255,255,255,.55);transform:rotate(-30deg)}
.balloon::after{content:"";position:absolute;bottom:-9px;left:50%;margin-left:-8px;border:8px solid transparent;border-bottom-color:inherit;border-top:0}
.balloon:nth-child(2){animation-delay:.07s,.3s}.balloon:nth-child(3){animation-delay:.14s,.6s}
.balloon:active{transform:translateY(4px) scale(.97)}
@keyframes pop{from{transform:scale(.5);opacity:0}}
@keyframes floaty{to{translate:0 -8px}}
.balloon.wrong{animation:shake .4s;opacity:.35}
.balloon.right{outline:7px solid var(--sun);outline-offset:3px;animation:bounce .6s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes bounce{40%{transform:scale(1.14) rotate(-4deg)}70%{transform:scale(.97) rotate(3deg)}}
.star{position:fixed;pointer-events:none;font-size:2rem;animation:fly 1.1s ease-out forwards;z-index:50}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(360deg);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<script src="tracker.js"></script>
</head>
<body>
<main class="stage">
  <div class="bar">
    <a class="btn" href="index.html" aria-label="Về trang chủ">🏠 Về nhà</a>
    <span class="score" id="score" aria-live="polite">⭐ 0</span>
  </div>
  <h1>Học Màu Sắc</h1>
  <button class="ask" id="ask" aria-label="Nghe lại câu hỏi">
    <span class="say">🔊</span>
    <span class="txt">Bé chạm vào màu<span class="name" id="cname"></span><span class="eg" id="ceg"></span></span>
  </button>
  <div class="praise" id="praise" aria-live="polite"></div>
  <div class="choices" id="choices"></div>
  <button class="btn" id="mute" aria-pressed="false">🔊 Âm thanh: Bật</button>
</main>

<script>
/* [tên, mã màu, hình gợi ý, tên đồ vật] — xếp theo thứ tự học: màu cơ bản trước */
const COLORS = [
  ['đỏ','#EF4444','🍎','quả táo'],['vàng','#FACC15','🍌','quả chuối'],['xanh dương','#3B82F6','🐳','cá voi'],['xanh lá','#22C55E','🐸','con ếch'],
  ['cam','#FB923C','🍊','quả cam'],['hồng','#F472B6','🐷','con heo'],['tím','#8B5CF6','🍇','chùm nho'],['nâu','#92603A','🐻','con gấu']
];
const $ = id => document.getElementById(id);
let score = 0, current = null, locked = false, muted = false, recent = [];
try { muted = localStorage.getItem('colorMuted') === '1'; } catch(e){}

let viVoice = null;
function loadVoice(){ viVoice = (speechSynthesis.getVoices()||[]).find(v=>/^vi/i.test(v.lang)) || null; }
if ('speechSynthesis' in window){ loadVoice(); speechSynthesis.onvoiceschanged = loadVoice; }
function say(text, onend){
  if (muted || !('speechSynthesis' in window)) { if (onend) onend(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'vi-VN'; if (viVoice) u.voice = viVoice; u.rate = .8; u.pitch = 1.2;
  if (onend) u.onend = onend;
  speechSynthesis.speak(u);
}
let ac = null;
function beep(ok){
  if (muted) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(ok?520:220, t);
    if (ok) o.frequency.exponentialRampToValueAtTime(880, t+.12);
    g.gain.setValueAtTime(.25, t); g.gain.exponentialRampToValueAtTime(.01, t+.2);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+.22);
  }catch(e){}
}

/* Học tăng dần: bắt đầu 4 màu cơ bản; cứ 3 lần đúng thì thêm 1 màu (tối đa 8).
   Dưới 6 màu: 2 bóng bay; từ 6 màu: 3 bóng bay. Tiến độ lưu trên thiết bị. */
function totalCorrect(){ try { return parseInt(localStorage.getItem('colorCorrect')||'0',10)||0; } catch(e){ return 0; } }
function pool(){ return COLORS.slice(0, Math.min(COLORS.length, 4 + Math.floor(totalCorrect()/3))); }
function choiceCount(){ return pool().length < 6 ? 2 : 3; }
function nextColor(){
  const p = pool(), keep = Math.min(2, p.length-2);
  const c = p.filter(x=>!recent.includes(x));
  const pick = c[Math.floor(Math.random()*c.length)];
  recent.push(pick); while (recent.length > keep) recent.shift();
  return pick;
}
function question(){ return 'Bé chạm vào màu ' + current[0] + ' nào! Màu ' + current[0] + ' giống ' + current[3] + '.'; }

function newRound(){
  locked = false; $('praise').textContent = '';
  current = nextColor();
  $('cname').textContent = current[0];
  $('ceg').textContent = current[2] + ' giống ' + current[3];
  const n = choiceCount();
  const wrong = pool().filter(c=>c!==current).sort(()=>Math.random()-.5).slice(0,n-1);
  const opts = [current,...wrong].sort(()=>Math.random()-.5);
  const box = $('choices'); box.innerHTML = ''; box.classList.toggle('two', n===2);
  opts.forEach(c=>{
    const b = document.createElement('button');
    b.className = 'balloon'; b.style.background = c[1]; b.style.borderBottomColor = c[1];
    b.setAttribute('aria-label', 'màu ' + c[0]);
    b.onclick = () => answer(b, c===current);
    box.appendChild(b);
  });
  setTimeout(()=>say(question()), 350);
}
function answer(btn, ok){
  if (locked) return;
  if (!ok){
    if (window.BeTracker) BeTracker.round(false);
    btn.classList.add('wrong'); beep(false); say('Chưa đúng. Bé thử lại nhé!');
    $('praise').textContent = 'Thử lại nhé! 💪'; return;
  }
  if (window.BeTracker) BeTracker.round(true);
  locked = true; btn.classList.add('right'); beep(true);
  try{ localStorage.setItem('colorCorrect', String(totalCorrect()+1)); }catch(e){}
  score++; $('score').textContent = '⭐ ' + score;
  const p = ['Giỏi quá!','Đúng rồi!','Bé tuyệt vời!','Hoan hô!'][Math.floor(Math.random()*4)];
  $('praise').textContent = p + ' 🎉';
  const r = btn.getBoundingClientRect();
  for (let i=0;i<10;i++){
    const s = document.createElement('div'); s.className='star'; s.textContent='⭐';
    s.style.left = (r.left+r.width/2)+'px'; s.style.top = (r.top+r.height/2)+'px';
    s.style.setProperty('--dx',(Math.random()*240-120)+'px'); s.style.setProperty('--dy',(Math.random()*-200-20)+'px');
    document.body.appendChild(s); setTimeout(()=>s.remove(),1200);
  }
  let advanced = false;
  const go = () => { if (advanced) return; advanced = true; setTimeout(newRound, 700); };
  say(p + ' Đây là màu ' + current[0] + '.', go);
  setTimeout(go, 4500);   // phòng khi trình duyệt không báo giọng đọc đã xong
}
$('ask').onclick = () => { if (current) say(question()); };
function renderMute(){ $('mute').textContent = muted ? '🔇 Âm thanh: Tắt' : '🔊 Âm thanh: Bật'; $('mute').setAttribute('aria-pressed', muted); }
$('mute').onclick = () => { muted = !muted; try{localStorage.setItem('colorMuted', muted?'1':'0');}catch(e){}; if (muted && 'speechSynthesis' in window) speechSynthesis.cancel(); renderMute(); };
renderMute(); newRound();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
